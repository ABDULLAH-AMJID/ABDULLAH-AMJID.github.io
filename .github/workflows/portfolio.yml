name: Update Portfolio

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "sync_repos.py"
      - "build.py"
      - "projects.json"
      - "index.html"
      - ".github/workflows/portfolio.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_repos.py

      - name: Generate project cards
        run: python build.py

      - name: Commit updated portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects.json index.html

          if git diff --cached --quiet; then
            echo "No portfolio changes"
          else
            git commit -m "chore: sync public repositories"
            git push
          fi